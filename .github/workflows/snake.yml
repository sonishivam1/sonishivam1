name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#6D4CFF&color_dots=#ebedf0,#DDD6FE,#B4A2FF,#8B6CFF,#6D4CFF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#EC4899&color_dots=#161b22,#2E1F6B,#4B33B3,#6D4CFF,#9B88FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
