-opacity="0.38"/><text x="687.3" y="403.5" class="chiptext" text-anchor="middle">PostgreSQL</text></g><g class="chip"><rect x="743.1" y="386" width="56.9" height="26" rx="13" fill="#FCD38A" fill-opacity="0.10" stroke="#FCD38A" stroke-opacity="0.38"/><text x="771.5" y="403.5" class="chiptext" text-anchor="middle">Redis</text></g>
